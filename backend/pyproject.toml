[project]
name = "ai-web-travel-assistant"
version = "0.1.0"
description = "Responsive web travel assistant API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.16.1,<3",
  "uvicorn>=0.30,<1",
  "tzdata>=2025.2,<2027",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]



